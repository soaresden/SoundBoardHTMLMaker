  <script>
    // Fichiers du Maître du Jeu à mettre en cache pour le mode hors-ligne (rôles + images de cartes)
    window.SB_OFFLINE_EXTRA_URLS = function () {
      const urls = ["gamemaster/roles/index.json"];
      const mapping = window.ROLE_FILE_MAPPING || {};
      Object.entries(mapping).forEach(([rid, file]) => {
        if (file) urls.push("gamemaster/roles/" + file + ".json");
        if (window.getRoleImagePath) urls.push(window.getRoleImagePath(rid));
      });
      return urls;
    };
  </script>
